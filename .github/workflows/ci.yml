# CI for shakenfist-utilities.
#
# Until this workflow the repository had no CI at all: release.yml was
# the only thing here, and it runs after a tag, which is too late to
# find anything. A library whose consumers are every other Shaken Fist
# project is a poor place to discover a break by publishing it.
#
# The whole gate is one job, because there is one gate's worth of work:
# flake8 over what changed, and the unit tests. Both run on a static
# runner -- nothing here installs an OS package or otherwise changes
# the machine, so nothing needs a throwaway VM.
name: CI

on:
  pull_request:
    branches: [develop]
  # pr-retest.yml re-runs this workflow by dispatching it, which is how
  # a bot commit (which does not itself trigger a pull_request event)
  # gets tested.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: [self-hosted, static]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-and-test
      cancel-in-progress: true

    steps:
      # fetch-depth: 0 for two reasons. tools/flake8wrap.sh diffs
      # against HEAD~1 to find the files this change touched, and
      # setuptools_scm derives the version from the most recent v* tag
      # when tox builds the package to test.
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A venv because the runners enforce PEP 668 and refuse a bare
      # install into the system environment.
      - name: Install tox
        run: |
          python3 -m venv /tmp/venv-ci
          /tmp/venv-ci/bin/pip install --quiet --disable-pip-version-check \
              tox

      # flake8wrap.sh checks only the Python files this change touched,
      # which is deliberate: the tree has never been clean under a
      # whole-repository run, and a lint job that is always red is a
      # lint job nobody reads.
      - name: Lint with flake8
        run: /tmp/venv-ci/bin/tox -eflake8

      # -epy3 rather than a bare `tox`: envlist is flake8, so the plain
      # invocation runs the linter twice and no tests at all.
      - name: Run the unit tests
        run: /tmp/venv-ci/bin/tox -epy3

      - name: Clean up
        if: always()
        run: rm -rf /tmp/venv-ci

  # The automatic review, gated on the job above passing: a job skipped
  # because a dependency failed never starts the reusable workflow, so
  # the needs list *is* the CI-passed gate.
  #
  # The body lives once, in shakenfist/actions. Two consequences worth
  # knowing before editing this. The permissions block has to be here
  # rather than there, because a cross-repository reusable workflow
  # cannot grant itself more token scope than its caller has -- and for
  # the same reason this job cannot set runs-on or timeout-minutes,
  # which the reusable workflow defines. And deliberately no
  # `secrets: inherit`: nothing in the reviewer chain reads a secret,
  # so inheriting would hand this repository's PyPI publishing rights
  # to a workflow living in another repository for no benefit at all.
  #
  # No event guard is needed for the workflow_dispatch trigger above.
  # The reusable workflow's own job is conditioned on the event being a
  # pull request, so a dispatch run skips it rather than failing on a
  # null pull request.
  automated_reviewer:
    name: "Automated reviewer"
    needs: [lint-and-test]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
