# GitHub CodeQL code scanning.
#
# Template source: shakenfist/development/templates/codeql/
#
# Copied unmodified: the template already targets develop, which is
# this repository's default branch. CodeQL needs a paid Advanced
# Security licence on private repositories, so this only belongs here
# because library-utilities is public.
#
# The actions: read permission is not decoration. Without it CodeQL
# cannot reach workflow run telemetry and fails with "Resource not
# accessible by integration".
name: CodeQL

permissions: {}

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 17 * * 2'

jobs:
  analyze:
    name: Analyze
    runs-on: [self-hosted, static]
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
